var ASSET_VERSION='5';

(function(){
  var tried=null;
  try{ tried=sessionStorage.getItem('knot-reload-target'); }catch(e){ return; }
  fetch('version.txt',{cache:'no-store'})
    .then(function(r){return r.ok?r.text():null;})
    .then(function(t){
      if(!t)return;
      var latest=t.trim();
      if(!latest||latest===ASSET_VERSION)return;
      if(tried===latest)return;        
      try{ sessionStorage.setItem('knot-reload-target',latest); }catch(e){}
      
      return fetch(location.href,{cache:'reload'})
        .catch(function(){})
        .then(function(){ location.reload(); });
    })
    .catch(function(){});
})();

async function loadGame(){
  try{
    var saved = JSON.parse(localStorage.getItem('knot-save'));
    if(saved){
      gameState.visited = saved.visited || {};
      gameState.choices = saved.choices || {};
      gameState.inventory = saved.inventory || {};
      gameState.questFlags = saved.questFlags || {};
      
      gameState.crocState = (saved.crocState==='aggressive'||saved.crocState==='passive')
        ? saved.crocState : 'intro';
      gameState.complete = saved.complete || false;
      
      if(gameState.complete)document.body.classList.add('postgame');
      
      if(gameState.inventory&&gameState.inventory.effigy&&!gameState.questFlags.effigy_burned){
        setTimeout(prepFinaleVideo,4000);
      }
      return true;
    }
  }catch(e){
    
  }
  return false;
}

async function saveGame(){
  try{
    localStorage.setItem('knot-save', JSON.stringify(gameState));
  }catch(e){
    
  }
}

function markVisited(zoneId){
  if(!gameState.visited[zoneId]){
    gameState.visited[zoneId] = true;
    saveGame();
  }
}

function saveChoice(zoneId, choiceId){
  gameState.choices[zoneId] = choiceId;
  saveGame();
}

function getVisitedCount(){
  return Object.keys(gameState.visited).length;
}

function hasVisited(zoneId){
  return !!gameState.visited[zoneId];
}

async function resetGame(){
  gameState = {visited:{},choices:{},inventory:{},questFlags:{},crocState:'intro',complete:false};

}

  var any=false;

  gameState.inventory[item] = true;

  renderInventory();

function hasItem(item){
  return !!gameState.inventory[item];
}

function removeItem(item){
  delete gameState.inventory[item];
  saveGame();
  renderInventory();
  refreshScene();

  gameState.questFlags[flag] = true;

  match:'icons/MATCH.png',
  water:'icons/WATER.png',
  diamond_necklace:'icons/NECKLACE.png',
  axe:'icons/AXE.png',
  thread:'icons/SPOOL.png',
  snail_stew:'icons/SLUG JUICE.png',
  crows_feather:'icons/FEATHER.png',
  effigy:'icons/EFFIGY.png'
};

function slotContentHTML(item){
  if(!item)return '<span class="slot-label"></span>';
  var icon=ITEM_ICONS[item];
  if(icon)return '<img class="slot-icon" draggable="false" src="'+v(encodeURI(icon))+'" alt="'+(ITEM_LABELS[item]||item)+'">';
  var label=ITEM_LABELS[item]||item.replace(/_/g,' ');
  return '<span class="slot-label">'+label+'</span>';
}

function paintSlot(slot,item){
  var next=item||'';
  var prev=slot.dataset.item||'';
  if(prev===next)return;
  slot.dataset.item=next;
  slot.classList.toggle('filled',!!next);
  var token=(+slot.dataset.token||0)+1;
  slot.dataset.token=token;
  var old=slot.firstElementChild;
  if(prev&&old){
    old.classList.add('leaving');
    setTimeout(function(){
      if(+slot.dataset.token!==token)return;   
      slot.innerHTML=slotContentHTML(next);
    },500);
  }else{
    slot.innerHTML=slotContentHTML(next);
  }
}

function renderInventory(){
  var inv=document.getElementById('inventory');
  if(!inv)return;
  if(hasFlag('effigy_burned')){inv.classList.add('hidden');return;}
  
  var placed=(currentSceneId==='cabin'&&hasItem('effigy'));
  var others=Object.keys(gameState.inventory).filter(function(k){
    return k!=='match'&&!(k==='effigy'&&placed)&&!pendingReveal[k];
  });
  var slots=inv.querySelectorAll('.inv-slot');
  paintSlot(slots[0],hasItem('match')?'match':null);
  for(var i=0;i<4;i++){
    paintSlot(slots[i+1],others[i]||null);
  }
}

(async function(){
  var forceNew = /[?&]reset\b/.test(location.search);
  if(forceNew){
    try{localStorage.removeItem('knot-save')}catch(e){}
  }
  var loaded = forceNew ? false : await loadGame();
  if(!loaded){
    
    gameState.inventory['match'] = true;
    saveGame();
  }
  revealPending();          
  renderInventory();
  
  setTimeout(prefetchScenes,1200);

})();

var swapToken=0;

function plateShown(n){
  if(n.tagName==='VIDEO')return n.style.opacity!=='0';
  return n.style.display!=='none';
}
function applyLayerVisibility(n,want){
  if(n.tagName==='VIDEO'){
    
    n.style.transition='none';
    n.style.display='';
    n.style.opacity=want?'':'0';
    (window.requestAnimationFrame||setTimeout)(function(){ n.style.transition=''; },0);
  }else{
    n.style.display=want?'':'none';
  }
  
  if(want)n.classList.remove('pending');
  
  if(!want&&n.tagName==='VIDEO'&&n.dataset.sound){
    n.muted=true;
    try{n.pause();}catch(e){}
  }
}

function commitLayerChange(pending,onSwap){
  
  var incoming=null;
  if(onSwap)onSwap();            
  pending.forEach(function(p){
    var n=p.node;
    if(!p.want)return;
    if(n.__released)return;      
    applyLayerVisibility(n,true);
    if(n.tagName!=='VIDEO')return;
    
    if(n.currentTime>0.1){ try{n.currentTime=0;}catch(e){} }
    
    if(n.dataset.sound&&!worldIsSilent()){
      n.muted=false;
      n.volume=crocIsVoicing()?0:LAYER_SOUND_VOLUME;
    }
    var q=n.play(); if(q&&q.catch)q.catch(function(){});
    if(!incoming)incoming=n;
  });
  
  function dropOutgoing(){
    pending.forEach(function(p){ if(!p.want)applyLayerVisibility(p.node,false); });
  }
  if(!incoming)dropOutgoing();
  else{
    var handed=false;
    function hand(){
      if(handed)return; handed=true;
      clearInterval(poll);
      dropOutgoing();
    }
    function confirmed(){ (window.requestAnimationFrame||setTimeout)(hand,0); }
    
    var presented=0;
    function onFrame(){
      if(handed)return;
      if(++presented>=2)confirmed();
      else incoming.requestVideoFrameCallback(onFrame);
    }
    var hasFrameCallback=!!incoming.requestVideoFrameCallback;
    if(hasFrameCallback)incoming.requestVideoFrameCallback(onFrame);
    
    var poll=setInterval(function(){
      if(handed)return;
      if(incoming.__released||!currentSceneId){ hand(); return; }
      if(!hasFrameCallback&&incoming.readyState>=2&&!incoming.seeking&&incoming.currentTime>0.15)confirmed();
    },32);
    
    setTimeout(function(){
      if(handed)return; handed=true;
      clearInterval(poll);
      pending.forEach(function(p){
        if(!p.want)return;
        if(p.node.dataset.sound)p.node.muted=true;   
        applyLayerVisibility(p.node,false);
      });
      
      pending.forEach(function(p){
        var n=p.node;
        if(p.want||n.__released||!currentSceneId)return;
        applyLayerVisibility(n,true);
        if(n.tagName==='VIDEO'){
          n.loop=true;
          var r=n.play(); if(r&&r.catch)r.catch(function(){});
        }
      });
    },8000);
  }
  enableGrabbables();
}

function scheduleLoopSwap(pending,outgoing,onSwap){
  var mine=++swapToken;
  
  outgoing.loop=false;
  
  var parked=[];
  pending.forEach(function(p){
    if(!p.want)return;
    var n=p.node;
    if(n.tagName!=='VIDEO'||n.__released)return;
    if(plateShown(n))return;                 
    try{ n.pause(); }catch(e){}
    try{ n.currentTime=0; }catch(e){}
    parked.push(n);
  });
  
  function unpark(){
    parked.forEach(function(n){
      if(n.__released||!plateShown(n)&&!n.paused)return;
      var r=n.play(); if(r&&r.catch)r.catch(function(){});
    });
  }
  function fire(){
    outgoing.removeEventListener('ended',fire);
    outgoing.loop=true;
    
    if(outgoing.__released)return;
    if(mine!==swapToken){ unpark(); return; }  
    if(!currentSceneId){ unpark(); return; }   
    
    commitLayerChange(pending,onSwap);
  }
  outgoing.addEventListener('ended',fire);
  
  var left=Math.max(0,(outgoing.duration||6.1)-(outgoing.currentTime||0));
  setTimeout(function(){ if(mine===swapToken)fire(); },(left+0.35)*1000);
}

function refreshScene(onSwap){
  if(!currentSceneId)return;
  var layers=sceneLayers[currentSceneId]||[];
  var nodes=el.zoneScene.querySelectorAll('.scene-layer');
  var pending=[],outgoing=null,instant=[];
  nodes.forEach(function(n){
    var L=layers[+n.getAttribute('data-li')];
    if(!L)return;
    var want=layerVisible(L), shown=plateShown(n);
    if(want===shown)return;
    if(L.loopSwap){
      
      if(want)warmLayer(n);
      pending.push({node:n,want:want});
      
      if(!want&&n.tagName==='VIDEO')outgoing=n;
      return;
    }
    
    if(want)warmLayer(n);
    instant.push({node:n,want:want});
  });
  if(instant.length)commitLayerChange(instant,onSwap);
  if(pending.length){
    if(outgoing)scheduleLoopSwap(pending,outgoing,onSwap);
    
    else{
      pending.forEach(function(p){applyLayerVisibility(p.node,p.want);});
      if(onSwap)onSwap();
    }
  }
  
  enableGrabbables();
}

function mapViewW(){return el.mapScreen?el.mapScreen.clientWidth:window.innerWidth}
function mapViewH(){return el.mapScreen?el.mapScreen.clientHeight:window.innerHeight}
function getExploreScale(){var sx=mapViewW()/1608,sy=mapViewH()/2000;return Math.max(sx,sy)*1.6}
function getPanBounds(){var s=getExploreScale();return{x:Math.max(0,(1608*s-mapViewW())/2),y:Math.max(0,(2000*s-mapViewH())/2)}}
function clampOffset(){var b=getPanBounds();state.wo.x=Math.max(-b.x,Math.min(b.x,state.wo.x));state.wo.y=Math.max(-b.y,Math.min(b.y,state.wo.y))}

var BG_MUSIC_VOLUME=1.6;   
var MUSIC_SILENT_ZONES={cabin:true};

var bgCtx=null, bgSource=null, bgGain=null, bgReady=false, bgWanted=0;
var bgFade=null;

function bgFallbackEl(){ return document.getElementById('bg-music'); }

var bgLoading=false;
function audioCtx(){
  if(bgCtx)return bgCtx;
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  try{
    bgCtx=new C();
    bgGain=bgCtx.createGain();
    bgGain.gain.value=0;
    bgGain.connect(bgCtx.destination);
  }catch(e){ bgCtx=null; }
  return bgCtx;
}

function initGaplessMusic(){
  if(bgLoading)return bgCtx;
  if(!audioCtx())return null;
  bgLoading=true;
  fetch(v('audio/UI/GAME_BG_LOOP.m4a'))
    .then(function(r){return r.arrayBuffer();})
    .then(function(buf){
      return new Promise(function(res,rej){
        
        var p=bgCtx.decodeAudioData(buf,res,rej);
        if(p&&p.then)p.then(res,rej);
      });
    })
    .then(function(audioBuf){
      bgSource=bgCtx.createBufferSource();
      bgSource.buffer=audioBuf;
      bgSource.loop=true;                 
      bgSource.connect(bgGain);
      bgSource.start(0);
      bgReady=true;
      var el2=bgFallbackEl();
      if(el2){el2.pause();el2.removeAttribute('src');}
      rampMusic(bgWanted,1800);
    })
    .catch(function(){ bgReady=false; });
  return bgCtx;
}

function rampMusic(to,ms){
  if(!bgGain||!bgCtx)return;
  var now=bgCtx.currentTime;
  bgGain.gain.cancelScheduledValues(now);
  bgGain.gain.setValueAtTime(bgGain.gain.value,now);
  bgGain.gain.linearRampToValueAtTime(to,now+(ms||900)/1000);
}

function fadeMusic(to,ms){
  bgWanted=to;
  if(bgReady)rampMusic(to,ms);
}

function startMusic(){
  if(worldIsSilent())return;    
  bgWanted=BG_MUSIC_VOLUME;
  initGaplessMusic();
  if(bgCtx&&bgCtx.state==='suspended')bgCtx.resume();
  
  fadeMusic(BG_MUSIC_VOLUME,1800);
}

function worldIsSilent(){

}

function updateMusicFor(zoneId){

  if(bgReady){
    if(bgCtx&&bgCtx.state==='suspended')bgCtx.resume();
    fadeMusic(silent?0:BG_MUSIC_VOLUME,silent?700:900);
    return;
  }
  fadeMusic(silent?0:BG_MUSIC_VOLUME,silent?700:900);
}

function waitForSceneReady(maxMs){
  if(!sceneUp)return Promise.resolve();
  return Promise.race([
    sceneUp,
    new Promise(function(r){setTimeout(r,maxMs||20000)})
  ]);
}

function prefetchScenes(){
  var seen={}, queue=[];
  function push(u){ if(u&&!seen[u]){seen[u]=1;queue.push(u);} }
  
  ['cliffs','cave','forest','swamp','cistern','desert','croc','cabin']
    .forEach(function(z){
      (sceneLayers[z]||[]).forEach(function(L){
        if(L.video)      push(v(ASSET+encodeURI(L.video)));
        else if(L.alpha) push(encodeURI(alphaSrc(L.alpha)));
        else if(L.img)   push(v(ASSET+encodeURI(L.img)));
      });
    });
  push(v(MAP_ART_POSTGAME));          

  var i=0, live=0, MAX=1;
  prefetchPump=function(){
    
    if(prefetchHeld)return;
    while(live<MAX&&i<queue.length){
      live++;
      var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
      if(ctl)prefetchLive.push(ctl);
      fetch(queue[i++],{cache:'force-cache',signal:ctl?ctl.signal:undefined})
        .then(function(r){return r.blob();})   
        .catch(function(){})
        .then(function(){
          if(ctl){var k=prefetchLive.indexOf(ctl); if(k>-1)prefetchLive.splice(k,1);}
          live--; prefetchPump();
        });
    }
  };
  prefetchPump();
}

var prefetchHeld=false, prefetchLive=[], prefetchPump=null;
function holdPrefetch(){
  prefetchHeld=true;
  prefetchLive.splice(0).forEach(function(c){ try{c.abort();}catch(e){} });
}
function releasePrefetch(){
  prefetchHeld=false;
  if(prefetchPump)prefetchPump();
}

var sceneUp=null, sceneUpResolve=function(){};

function stageSceneMedia(){
  
  sceneUp=null;
  var settleSceneUp=null;
  sceneUp=new Promise(function(r){ settleSceneUp=r; });
  sceneUpResolve=function(){
    if(!settleSceneUp)return;
    var r=settleSceneUp; settleSceneUp=null; r();
  };

  var nodes=[].slice.call(el.zoneScene.querySelectorAll('.scene-layer'))
    .filter(plateShown);
  if(!nodes.length){ sceneUpResolve(); return; }
  var bg=nodes[0];                 
  var bgUp=false;
  var forScene=currentSceneId;

  function ready(n){
    
    return n.tagName==='IMG' ? (n.complete&&n.naturalWidth>0) : n.readyState>=3;
  }
  function show(n){ n.classList.remove('pending'); }
  function sweep(){
    
    if(!bgUp)return;
    nodes.forEach(function(n){ if(ready(n))show(n); });
  }
  function arrived(n){
    if(currentSceneId!==forScene)return;   
    
    if(n.__released)return;
    if(n===bg)bgUp=true;
    sweep();
    if(allUp()){ clearSceneFailure(); hideLoadingCue(); sceneUpResolve(); warmHiddenLayers(); }
  }
  function allUp(){ return nodes.every(ready); }

  nodes.forEach(function(n){
    n.classList.add('pending');
    if(ready(n)){ arrived(n); return; }
    
    ['canplay','loadeddata','load'].forEach(function(e){
      n.addEventListener(e,function(){arrived(n)},{once:true});
    });
  });

  if(allUp()){ sceneUpResolve(); warmHiddenLayers(); return; }

  function failIfStillHere(){
    if(currentSceneId!==forScene)return;   
    if(allUp())return;
    failSceneLoad();
  }
  nodes.forEach(function(n){
    
    n.addEventListener('error',function(){
      if(n.__released)return;              
      if(n.dataset.retried)failIfStillHere();
    });
  });
  sceneFailTimer=setTimeout(failIfStillHere,15000);
}

var sceneFailTimer=null;

var finaleRetry=null;
function clearSceneFailure(){
  if(sceneFailTimer){clearTimeout(sceneFailTimer);sceneFailTimer=null;}
  var f=document.getElementById('scene-failed');
  if(f){f.classList.remove('vis');setTimeout(function(){f.classList.remove('show')},400);}
}
function failSceneLoad(){
  if(sceneFailTimer){clearTimeout(sceneFailTimer);sceneFailTimer=null;}
  hideLoadingCue();
  
  sceneUpResolve();
  var f=document.getElementById('scene-failed');
  if(!f){closeZone();return;}          
  f.classList.add('show');
  setTimeout(function(){f.classList.add('vis')},20);
}
(function(){
  var f=document.getElementById('scene-failed');
  if(!f)return;
  f.querySelector('.sf-retry').addEventListener('click',function(){
    if(finaleRetry){
      var again=finaleRetry; finaleRetry=null;
      clearSceneFailure();
      again();
      return;
    }

function guardSceneMedia(){
  [].forEach.call(el.zoneScene.querySelectorAll('video,img'),function(n){
    n.addEventListener('error',function(){
      if(n.__released)return;    
      if(n.dataset.retried)return;
      n.dataset.retried='1';
      var src=n.getAttribute('src');
      setTimeout(function(){
        n.setAttribute('src',src+(src.indexOf('?')>-1?'&':'?')+'retry=1');
        if(n.tagName==='VIDEO'){n.load();var p=n.play();if(p&&p.catch)p.catch(function(){});}
      },700);
    },{once:true});
  });
}

function warmHiddenLayers(){
  [].forEach.call(el.zoneScene.querySelectorAll('video'),function(n){
    if(plateShown(n)||n.__released)return;
    if(n.preload!=='auto'){
      n.preload='auto';
      try{n.load();}catch(e){}
    }
    if(n.__armedIdle)return;
    n.__armedIdle=1;
    function park(){
      if(plateShown(n)||n.__released)return;
      try{n.pause();}catch(e){}
      try{ if(n.currentTime>0.001)n.currentTime=0; }catch(e){}
    }
    if(n.readyState>=2)park();
    else n.addEventListener('loadeddata',park,{once:true});
  });
}

function resumeSceneVideos(){
  if(!el.zoneScene)return;
  [].forEach.call(el.zoneScene.querySelectorAll('video'),function(v){
    if(!plateShown(v))return;
    if(v.__released||v.__swapOut)return;
    if(v.ended||!v.paused)return;            
    var p=v.play(); if(p&&p.catch)p.catch(function(){});
  });
}

function buildKidCues(){
  var pool=KK_LINES.slice();
  for(var i=pool.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),t=pool[i];pool[i]=pool[j];pool[j]=t;
  }

  var cues=KK_SLOTS.map(function(at,i){return {at:at,line:chosen[i],hold:KK_HOLD};});
  cues.push({at:KK_OUTRO_AT,outro:true});
  return cues;
}

function rewindFinale(v,tries){

  try{ v.currentTime=0; }catch(e){}

}

var finalePrimed=false;
function primeFinaleVideo(){
  if(finalePrimed)return;
  if(!hasItem('effigy')||hasFlag('effigy_burned'))return;
  if(document.body.classList.contains('finale'))return;
  var v=document.getElementById('kk-video');
  if(!v)return;
  finalePrimed=true;
  prepFinaleVideo();
  v.muted=true;
  var stopped=false,guard=null;
  function back(){
    if(stopped)return; stopped=true;
    clearTimeout(guard);
    v.removeEventListener('timeupdate',onTime);
    try{v.pause();}catch(e){}
    
    try{v.currentTime=0;}catch(e){}
    rewindFinale(v);
  }
  
  function onTime(){ if(v.currentTime>0)back(); }
  v.addEventListener('timeupdate',onTime);
  guard=setTimeout(back,1500);
  var p=v.play();
  if(p&&p.then)p.then(back,function(){
    clearTimeout(guard);
    v.removeEventListener('timeupdate',onTime);
    finalePrimed=false;
  });
  else back();
}
document.addEventListener('pointerdown',primeFinaleVideo,true);
document.addEventListener('touchend',primeFinaleVideo,true);

function startFinaleVideo(v){
  return new Promise(function(resolve){
    if(!v)return resolve(false);
    var settled=false,dead=false;
    function done(ok){
      if(settled)return; settled=true;
      if(!ok)dead=true;
      resolve(ok);
    }
    
    var shown=false,paintPoll=null;
    
    function reveal(){
      if(shown||dead)return; shown=true;
      if(paintPoll){clearInterval(paintPoll);paintPoll=null;}
      v.classList.add('vis');
      document.body.classList.add('finale-video');
    }
    var unmuted=false;
    function unmute(){
      if(unmuted)return; unmuted=true;
      v.muted=false;
      fadeInFinaleAudio(v,2600);
      done(true);
    }
    var rewound=false;
    function start(){
      if(dead)return;
      
      if(!rewound){ rewound=true; rewindFinale(v); }
      if(!unmuted){ v.muted=true; v.volume=0; }
      var p=v.play();
      if(p&&p.then){
        
        p.then(unmute).catch(failFinale);
      }else{unmute();}
    }

    v.addEventListener('error',function(){ failFinale(); });
    v.addEventListener('loadeddata',function(){
      
      start();
      
      if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(function(){reveal();});
    },{once:true});
    
    paintPoll=setInterval(function(){
      if(shown)return;
      if(v.readyState>=2&&!v.seeking&&v.currentTime>0)reveal();
    },32);
    
    if(!v.getAttribute('src')){
      v.src=v_(FINALE_VIDEO);
      v.load();
    }else if(v.readyState>=2){
      
      v.dispatchEvent(new Event('loadeddata'));
    }
    
    start();
    
    var loadCheck=null;
    function failFinale(){
      if(shown)return;
      clearTimeout(loadCheck);
      var f=document.getElementById('scene-failed');
      if(!f||f.classList.contains('show'))return;
      f.classList.add('finale-fail');
      finaleRetry=function(){
        f.classList.remove('finale-fail');
        try{ v.pause(); }catch(e){}
        
        v.src=v_(FINALE_VIDEO)+'&retry='+Date.now();
        try{ v.load(); }catch(e){}
        start();
        armLoadCheck();
      };
      f.classList.add('show');
      setTimeout(function(){f.classList.add('vis')},20);
    }
    function armLoadCheck(){
      clearTimeout(loadCheck);
      
      loadCheck=setTimeout(function(){ if(!shown)failFinale(); },25000);
    }
    armLoadCheck();
  });
}

function runCuedFinale(v){
  return new Promise(function(resolve){
    var fired=[],pending=[],ended=false;
    var iv=setInterval(function(){
      var t=v.currentTime;
      KK_CUES.forEach(function(c,i){
        if(fired[i]||t<c.at)return;
        fired[i]=true;
        if(c.outro){finish();return;}
        pending.push(floatKidLine(c.line,c.hold||KK_HOLD).life);
      });
      if(!ended&&v.ended)finish();
    },50);
    function finish(){
      if(ended)return;
      ended=true;
      clearInterval(iv);
      Promise.all(pending).then(resolve);
    }
    v.addEventListener('ended',finish,{once:true});
  });
}

async function runUntimedFinale(){
  await wait(1100);
  var pending=[];
  for(var i=0;i<KK_CUES.length;i++){
    if(!KK_CUES[i].line)continue;
    var ctl=floatKidLine(KK_CUES[i].line);
    pending.push(ctl.life);
    await ctl.typed;
    await wait(520);
  }
  await Promise.all(pending);
  await wait(900);
}

  document.body.classList.add('finale');

  var v=document.getElementById('kk-video');
  var hasVideo=await startFinaleVideo(v);
  if(hasVideo) await runCuedFinale(v);

  gameState.complete=true;

var lastVoicePick={};            
var currentVoice=null;           
var voiceArmed=false;            

function armVoice(speaker,key){
  currentVoice={speaker:speaker||null,key:key||null};
  voiceArmed=true;
}
var voiceToken=0;                

function pickFrom(list,memo){
  if(!list||!list.length)return null;
  if(list.length===1)return list[0];
  var i,guard=0;
  do{ i=Math.floor(Math.random()*list.length); }
  while(list[i]===lastVoicePick[memo]&&++guard<8);
  lastVoicePick[memo]=list[i];
  return list[i];
}

function pickVoiceSrc(ctx){
  if(ctx&&ctx.key&&VOICE_SPECIAL[ctx.key]){
    var sp=VOICE_SPECIAL[ctx.key];
    return typeof sp==='string' ? sp : pickFrom(sp,ctx.key);
  }
  var list=ctx&&ctx.speaker?VOICE_CLIPS[ctx.speaker]:null;
  return pickFrom(list,ctx&&ctx.speaker);
}

function voicePoolFor(ctx){
  if(ctx&&ctx.key&&VOICE_SPECIAL[ctx.key]){
    var sp=VOICE_SPECIAL[ctx.key];
    return (typeof sp==='string')?null:sp;
  }
  return (ctx&&ctx.speaker)?VOICE_CLIPS[ctx.speaker]:null;
}

var VOICE_VOLUME=1;   
var VOICE_FADE_MS=320;
var voiceFade=null;              
var voiceChainEnded=null;        
var voiceIsLone=false;           

function clearVoiceFade(v){
  if(voiceFade){clearInterval(voiceFade);voiceFade=null;}
  v.volume=VOICE_VOLUME;
}
function detachVoiceChain(v){
  if(voiceChainEnded){v.removeEventListener('ended',voiceChainEnded);voiceChainEnded=null;}
}

function fadeOutVoice(v,ms){
  if(v.paused)return;
  if(voiceFade)clearInterval(voiceFade);
  var from=v.volume, steps=Math.max(1,Math.round(ms/40)), i=0;
  voiceFade=setInterval(function(){
    i++;
    v.volume=Math.max(0,from*(1-i/steps));
    if(i>=steps){
      clearInterval(voiceFade);voiceFade=null;
      v.pause();v.volume=VOICE_VOLUME;
    }
  },40);
}
function startTake(v,src,mine){
  if(mine!==voiceToken)return;
  if(v.getAttribute('data-src')!==src){v.src=v_(src);v.setAttribute('data-src',src);}
  v.loop=false;
  clearVoiceFade(v);
  function go(){
    if(mine!==voiceToken)return;
    try{v.currentTime=0;}catch(e){}
    var p=v.play();
    if(p&&p.catch)p.catch(function(){});
  }
  if(v.readyState<2)v.addEventListener('loadeddata',go,{once:true});
  else go();
}
function playVoiceFor(ctx){
  if(worldIsSilent())return;
  var v=document.getElementById('voice-audio');
  if(!v)return;
  var src=pickVoiceSrc(ctx);
  if(!src)return;
  var mine=++voiceToken;
  detachVoiceChain(v);
  voiceIsLone=!!(ctx&&ctx.key&&typeof VOICE_SPECIAL[ctx.key]==='string');
  startTake(v,src,mine);

  var pool=voicePoolFor(ctx);
  if(pool&&pool.length>1){
    var memo=(ctx&&(ctx.key||ctx.speaker))||'voice';
    voiceChainEnded=function(){
      if(mine!==voiceToken)return;
      var next=pickFrom(pool,memo);
      if(next)startTake(v,next,mine);
    };
    v.addEventListener('ended',voiceChainEnded);
  }
}
function playVoice(zoneId){ playVoiceFor({speaker:null,key:null}); }
function stopVoice(force){
  var v=document.getElementById('voice-audio');
  if(!v)return;
  detachVoiceChain(v);
  if(force){
    voiceToken++;
    clearVoiceFade(v);
    v.pause();
    return;
  }
  if(voiceIsLone)return;
  fadeOutVoice(v,VOICE_FADE_MS);
}

var sfxRaw={}, sfxBuf={}, sfxDecoding={};

function fetchRaw(src){
  if(sfxRaw[src]||sfxBuf[src])return;
  sfxRaw[src]=fetch(v(src))
    .then(function(r){return r.ok?r.arrayBuffer():null;})
    .catch(function(){return null;});
}
function decodeSound(src){
  if(sfxBuf[src])return Promise.resolve(sfxBuf[src]);
  if(sfxDecoding[src])return sfxDecoding[src];
  var ctx=audioCtx();
  if(!ctx)return Promise.resolve(null);
  fetchRaw(src);
  sfxDecoding[src]=sfxRaw[src].then(function(buf){
    if(!buf)return null;
    return new Promise(function(res){
      
      var p=ctx.decodeAudioData(buf,res,function(){res(null);});
      if(p&&p.then)p.then(res,function(){res(null);});
    });
  }).then(function(b){
    if(b){ sfxBuf[src]=b; }
    else { delete sfxDecoding[src]; delete sfxRaw[src]; }   
    return b;
  });
  return sfxDecoding[src];
}

function playBuffered(src,vol){
  var b=sfxBuf[src], ctx=bgCtx;
  if(!b||!ctx)return false;
  function fire(){
    var s=ctx.createBufferSource(), g=ctx.createGain();
    s.buffer=b;
    g.gain.value=vol;
    s.connect(g);
    g.connect(ctx.destination);
    s.start(0);
  }
  
  if(ctx.state==='suspended'){
    var r=ctx.resume();
    if(r&&r.then)r.then(fire,fire); else fire();
  }else fire();
  return true;
}

function rampLayerSound(to,ms){
  clearInterval(duckRamp);
  var ns=soundLayers();
  if(!ns.length)return;
  var from=ns[0].volume, steps=Math.max(1,Math.round(ms/40)), i=0;
  duckRamp=setInterval(function(){
    i++;
    var v=from+(to-from)*(i/steps);
    ns.forEach(function(n){ try{ n.volume=Math.max(0,Math.min(1,v)); }catch(e){} });
    if(i>=steps)clearInterval(duckRamp);
  },40);
}
function initLayerSound(){
  if(worldIsSilent())return;
  soundLayers().forEach(function(n){
    
    if(!plateShown(n))return;
    function unmute(){
      if(n.__released)return;
      n.volume=crocIsVoicing()?0:LAYER_SOUND_VOLUME;
      n.muted=false;
      var p=n.play();
      if(p&&p.catch)p.catch(function(){ n.muted=true; });
    }
    if(n.readyState>=2)unmute();
    else n.addEventListener('loadeddata',unmute,{once:true});
  });
}

var introCancel=null;
function cancelIntro(){ if(introCancel)introCancel(); introCancel=null; }
function showIntro(text){
  var box=document.getElementById('scene-intro');
  var wrap=document.getElementById('dialogue-wrap');
  var gen=sceneGen;
  return new Promise(function(resolve){
    function reveal(){ if(wrap)wrap.classList.remove('dim'); }
    if(!text||!box){reveal();return resolve();}
    var go=box.querySelector('.si-go');
    if(go)go.classList.remove('show');
    box.querySelector('.si-note').textContent=text;
    setTimeout(function(){box.classList.add('vis')},20);

    var armed=false, done=false;
    setTimeout(function(){armed=true},700);        
    
    var cueTimer=setTimeout(function(){if(!done&&go)go.classList.add('show')},6000);
    function teardown(){
      clearTimeout(cueTimer);
      if(go)go.classList.remove('show');
      document.removeEventListener('click',dismiss,true);
      document.removeEventListener('keydown',onKey,true);
    }
    introCancel=function(){ done=true; teardown(); box.classList.remove('vis'); };
    function dismiss(){
      if(!armed||done)return;
      done=true;
      teardown();
      introCancel=null;
      box.classList.remove('vis');
      setTimeout(function(){
        box.querySelector('.si-note').textContent='';
        reveal();                                   
        setTimeout(function(){ if(gen===sceneGen)resolve(); },350);
      },700);
    }
    function onKey(e){ if(e.key==='Enter'||e.key===' ')dismiss(); }
    document.addEventListener('click',dismiss,true);
    document.addEventListener('keydown',onKey,true);
  });
}

async function runStateNode(ch,node,id){
  var speaker=node.narration?'':ch.name;
  var raw=node.lines||node.text;
  var arr=(typeof raw==='function')?raw():raw;
  if(!Array.isArray(arr))arr=[arr];
  
  if(node.feel&&node.feelFirst) await say('',node.feel);
  for(var i=0;i<arr.length-1;i++) await say(speaker,arr[i]);
  
  await line(speaker,arr[arr.length-1]);
  if(node.feel&&!node.feelFirst){
    await waitForAdvance();
    await line('',node.feel);
  }
  
  if(node.choices){
    showChoices(id,node.choices);
    showZoneOffer();
  }else{
    showZoneOffer();
    waitForAdvance().then(function(){markZoneExhausted()});
  }
}

function handleChoice(zoneId,choice){
  var ch=characters[zoneId];
  el.choices.classList.remove('active');
  el.choices.innerHTML='';   
  
  var currentText=el.charText.textContent;
  if(currentText&&currentText.trim())addMessage('npc',el.charName.textContent,currentText);

  var node;
  if(ch.dynamic){
    node = ch.states[choice.next];
  }else{
    node = ch.tree[choice.next];
    saveChoice(zoneId,choice.next);
    
    if(choice.next==='yes_response'&&ch.tree['yes_response_alt']&&Math.random()>0.5){
      node=ch.tree['yes_response_alt'];
    }
  }

  if(!node) return;

  line(node.narration?'':ch.name,node.text).then(function(){
    
    if(node.action === 'set_flag' && node.flag){
      setFlag(node.flag);
    }
    if(node.action === 'add_item' && node.item){
      addItem(node.item);
      if(node.flag) setFlag(node.flag);
    }
    
    if(node.action === 'trade_axe_for_thread'){
      removeItem('axe');
      addItem('thread');
      setFlag('butcher_gave_thread');
      setTimeout(function(){markZoneExhausted()},2500);
      return;
    }

    if(node.action === 'leave'){
      setTimeout(function(){
        addMessage('npc',ch.name,node.text);
        
        fadeSceneLayer('DESERT_SHADOW');
        line('','The shadow turns without another word and the dust swallows him.').then(function(){
          waitForAdvance().then(function(){markZoneExhausted()});
        });
      },2000);
    }else if(node.choices){
      showChoices(zoneId,node.choices);
      showZoneOffer();
    }else{
      waitForAdvance().then(function(){markZoneExhausted()});
    }
  });
}

var activeType=null;     

var sceneGen=0;

function sceneDelay(ms){
  var gen=sceneGen;
  return new Promise(function(r){ setTimeout(function(){ if(gen===sceneGen)r(); },ms); });
}
function abortType(){
  if(activeType&&activeType.abort)activeType.abort();
  activeType=null;
}
function typewrite(element,text,speed){
  var gen=sceneGen;
  return new Promise(function(resolve){
    element.innerHTML='';
    var i=0;
    var cursor=document.createElement('span');
    cursor.className='cursor';
    element.appendChild(cursor);
    
    if(!voiceArmed)currentVoice={speaker:el.charName.textContent||null,key:null};
    voiceArmed=false;
    playVoiceFor(currentVoice);
    var interval=null;
    var me={};
    function done(){
      if(interval){clearInterval(interval);interval=null;}
      if(activeType===me)activeType=null;
      releasePrefetch();                 
      if(gen!==sceneGen)return;   
      stopVoice();
      
      enableGrabbables();
      resolve();
    }
    
    me.abort=function(){
      if(interval){clearInterval(interval);interval=null;}
      if(activeType===me)activeType=null;
      releasePrefetch();
    };
    
    me.finish=function(){
      if(interval===null)return;
      if(cursor.parentNode===element){
        while(i<text.length){element.insertBefore(document.createTextNode(text[i]),cursor);i++;}
        cursor.remove();
      }
      done();
    };
    activeType=me;
    
    holdPrefetch();
    interval=setInterval(function(){
      
      if(cursor.parentNode!==element){done();return;}
      if(i<text.length){
        element.insertBefore(document.createTextNode(text[i]),cursor);
        i++;
      }else{
        cursor.remove();
        done();
      }
    },speed||35);
  });
}

  var zone=state.zone, cfg=ZONE_ITEM_USE[zone]||{};
  
  var accepted=(cfg.accepts||[]).indexOf(item)!==-1
               &&(!cfg.wants||cfg.wants(item));
  usingItem=true;

  try{
    if(!accepted){
      
      playSfx(pickFrom(SFX_WRONG,'wrong_item'),1);
      await line(cfg.speaker||'',cfg.refuse||'Nothing happens.');
      usingItem=false;
      waitForAdvance().then(function(){markZoneExhausted()});

    el.zReturn.classList.remove('show');
    
    var seq=null;
    if(zone==='cave'){ seq=runGiveAxe(); }

    else if(zone==='cliffs'){ seq=runGiveToM(item); }
    else if(zone==='cabin'){ seq=runLightEffigy(); }
    usingItem=false;
    if(seq)await seq;
  }finally{ usingItem=false; }

  var desc=m.querySelector('.im-desc');

      m.classList.remove('vis');

      useBtn.onclick=null;closeBtn.onclick=null;m.onclick=null;
      forceShutItemModal=null;

    useBtn.onclick=function(e){e.stopPropagation();playClick();shut(true)};

          el.userInput.focus();
        }));
      },1800);
    }
  }else{
    sendToCharacter(state.zone,text);
  }
}

var DRAG_THRESHOLD=8;          
var drag=null;                 
var suppressAdvanceUntil=0;    

function makeGhost(slot,x,y){
  var g=document.createElement('div');
  g.id='drag-ghost';
  var art=slot.querySelector('.slot-icon');
  if(art){
    var im=document.createElement('img');
    im.src=art.getAttribute('src');
    g.appendChild(im);
  }else{
    g.textContent=slot.dataset.item||'';
  }
  document.body.appendChild(g);
  moveGhost(g,x,y);
  return g;
}
function moveGhost(g,x,y){ g.style.left=x+'px'; g.style.top=y+'px'; }

function unbindDrag(){
  document.removeEventListener('pointermove',onDragMove);
  document.removeEventListener('pointerup',endDrag);
  document.removeEventListener('pointercancel',cancelDrag);
}

function cancelDrag(){
  if(!drag)return;
  var d=drag; drag=null;
  unbindDrag();
  if(d.ghost&&d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
  document.body.classList.remove('dragging-item');
}
function endDrag(e){
  if(!drag)return;
  var d=drag; drag=null;
  unbindDrag();
  if(d.ghost&&d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
  document.body.classList.remove('dragging-item');

  if(!d.moved){ slotClicked(d.slot); return; }        

  var overScene=false;
  if(e&&state.phase==='zone'){
    var t=document.elementFromPoint(e.clientX,e.clientY);
    overScene=!!(t&&!t.closest('#inventory')&&t.closest('#zone-screen'));
  }
  suppressAdvanceUntil=Date.now()+400;                 
  if(overScene)useItemHere(d.item);
}
function onDragMove(e){
  if(!drag)return;
  if(!drag.moved){
    if(Math.abs(e.clientX-drag.x0)<DRAG_THRESHOLD&&Math.abs(e.clientY-drag.y0)<DRAG_THRESHOLD)return;
    drag.moved=true;
    drag.ghost=makeGhost(drag.slot,e.clientX,e.clientY);
    document.body.classList.add('dragging-item');
  }
  moveGhost(drag.ghost,e.clientX,e.clientY);
  if(e.cancelable)e.preventDefault();
}

    if(e.cancelable)e.preventDefault();

    drag={slot:slot,item:item,ghost:null,moved:false,x0:e.clientX,y0:e.clientY};
    document.addEventListener('pointermove',onDragMove);
    document.addEventListener('pointerup',endDrag);
    document.addEventListener('pointercancel',cancelDrag);
  });
  slot.addEventListener('dragstart',function(e){e.preventDefault();});
  
  slot.addEventListener('click',function(e){e.stopPropagation();});
});

(function(){
  var root=document.getElementById('sun-letter');
  if(!root){ revealGate(); return; }
  var stage=root.querySelector('.sl-stage');
  var source=document.getElementById('sl-narration');
  var canvas=document.getElementById('sl-text');
  var camera=document.getElementById('sl-reflection');
  var begin=document.getElementById('sl-begin');
  var hint=document.getElementById('sl-hint');
  var message=document.getElementById('sl-message');
  var skip=document.getElementById('sl-skip');

  var out=canvas.getContext('2d');
  var packed=document.createElement('canvas');
  var W=canvas.width,H=canvas.height;
  packed.width=W*2; packed.height=H;
  var reader=packed.getContext('2d',{willReadFrequently:true});
  var frame=null;
  var hasVFC=typeof source.requestVideoFrameCallback==='function';

  function draw(){
    if(source.readyState<2||!out||!reader)return;
    reader.drawImage(source,0,0,packed.width,packed.height);
    var colour=reader.getImageData(0,0,W,H);
    var mask=reader.getImageData(W,0,W,H).data;
    for(var i=3;i<colour.data.length;i+=4)colour.data[i]=mask[i-3];
    out.putImageData(colour,0,0);
  }
  function cancelDraw(){
    if(frame===null)return;
    if(hasVFC)source.cancelVideoFrameCallback(frame); else cancelAnimationFrame(frame);
    frame=null;
  }
  function nextFrame(){
    frame=null;
    draw();
    if(!source.paused&&!source.ended)
      frame=hasVFC?source.requestVideoFrameCallback(nextFrame):requestAnimationFrame(nextFrame);
  }
  source.addEventListener('playing',function(){cancelDraw();nextFrame();offerSkip(4000)});
  source.addEventListener('pause',cancelDraw);
  source.addEventListener('ended',function(){cancelDraw();draw()});
  source.addEventListener('loadeddata',draw);
  source.addEventListener('seeked',draw);

  var noCamera=false;
  var stream=null,generation=0,fadeTimer=null,mode='idle';
  var live=['requesting','starting','ready','revealing','fading'];
  holdPrefetch();
  source.addEventListener('canplaythrough',releasePrefetch);
  setTimeout(releasePrefetch,20000);      

  function setMode(next){ mode=next; stage.dataset.state=next; }
  
  var skipTimer=null;
  function offerSkip(delay){
    if(root.classList.contains('offer-skip')||skipTimer)return;
    skipTimer=setTimeout(function(){ root.classList.add('offer-skip'); },delay||0);
  }
  function releaseCamera(){
    clearTimeout(fadeTimer); fadeTimer=null;
    var previous=stream; stream=null;
    if(previous)previous.getTracks().forEach(function(t){ t.onended=null; t.stop(); });
    try{camera.pause();}catch(e){}
    camera.srcObject=null;
  }
  function rest(error){
    generation+=1;                        
    try{source.pause();source.currentTime=0;}catch(e){}
    releaseCamera();
    setMode(error?'error':'idle');
    begin.disabled=false;
    
    var say=(typeof error==='string')?error:'';
    message.textContent=say;
    hint.textContent=error?(say?'Or continue below':''):'Allow your camera to begin';
    
    if(error){ skip.textContent='Continue'; offerSkip(0); }
  }
  
  var left=false;
  function leave(){
    if(left)return; left=true;
    cancelDraw();
    try{source.pause();}catch(e){}
    releaseCamera();
    releasePrefetch();
    root.classList.add('gone');
    setTimeout(function(){ if(root.parentNode)root.parentNode.removeChild(root); },1600);
    revealGate();
  }
  function finish(){
    if((!stream&&!noCamera)||(mode!=='revealing'&&mode!=='starting'))return;
    setMode('fading');
    root.classList.add('closing');     
    var ms=matchMedia('(prefers-reduced-motion: reduce)').matches?0:1400;
    fadeTimer=setTimeout(leave,ms);
  }

  function playAfterPermission(request){
    
    if((!stream&&!noCamera)||generation!==request||document.hidden)return Promise.resolve();
    setMode('starting');
    begin.disabled=true;
    hint.textContent='Starting…';
    try{source.currentTime=0;}catch(e){}
    var played=source.play();
    
    if(!played||!played.then){ setMode('revealing'); return Promise.resolve(); }
    return played.then(function(){
      if(generation!==request||mode!=='starting')return;
      if(document.hidden){rest();return;}
      setMode('revealing');
    },function(error){
      if(generation!==request)return;
      if(error&&error.name==='NotAllowedError'){
        
        setMode('ready');
        begin.disabled=false;
        hint.textContent='Camera allowed. Press play to begin.';
      }else{
        rest('The audio couldn’t play. Please try again.');
      }
    });
  }

  function start(){
    if(mode==='ready')return playAfterPermission(generation);
    if(live.indexOf(mode)>-1)return;
    
    if(noCamera){ message.textContent=''; return playAfterPermission(++generation); }
    if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      noCamera=true;
      rest(true);          
      return;
    }
    var request=++generation;
    setMode('requesting');
    message.textContent='';
    begin.disabled=true;
    hint.textContent='Allow camera access in your browser';
    navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'user'},width:{ideal:720},height:{ideal:1280},aspectRatio:{ideal:9/16},resizeMode:{ideal:'crop-and-scale'}},
      audio:false
    }).then(function(acquired){
      if(generation!==request||document.hidden||mode!=='requesting'){
        acquired.getTracks().forEach(function(t){t.stop()});
        return;
      }
      stream=acquired;
      stream.getVideoTracks().forEach(function(t){
        t.onended=function(){ rest('The camera was disconnected.'); };
      });
      camera.srcObject=acquired;
      camera.muted=true;
      return camera.play().then(function(){
        if(generation!==request||mode!=='requesting')return;
        if(document.hidden){rest();return;}
        return playAfterPermission(request);
      });
    }).catch(function(error){
      if(generation!==request)return;
      
      noCamera=true;
      rest(true);
    });
  }

  source.addEventListener('ended',finish);
  source.addEventListener('error',function(){
    
    if(['starting','ready','revealing'].indexOf(mode)>-1)leave();
  });
  begin.addEventListener('click',start);
  skip.addEventListener('click',leave);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden&&live.indexOf(mode)>-1)rest();
  });
  window.addEventListener('pagehide',function(){ releaseCamera(); });
  draw();
})();
})();
</script>
